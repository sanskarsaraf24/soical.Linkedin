## Security Checklist

- [ ] OAuth tokens encrypted in MongoDB
- [ ] API key rotation strategy (monthly)
- [ ] CORS configured (only trusted domains)
- [ ] CSRF protection enabled
- [ ] Rate limiting (100 req/min per IP)
- [ ] Input validation on all endpoints
- [ ] XSS protection (React + DOMPurify)
- [ ] SQL/NoSQL injection prevention
- [ ] HTTPS enforced (LiteSpeed SSL)
- [ ] Audit logging for sensitive operations
- [ ] MongoDB backup daily
- [ ] Secrets in .env (never in git)
- [ ] Dependencies security scan

