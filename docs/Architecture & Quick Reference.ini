## API Endpoints Quick Reference

### Authentication
```
POST   /api/auth/linkedin          - Redirect to LinkedIn OAuth
GET    /api/auth/callback          - OAuth callback handler
POST   /api/auth/refresh           - Refresh access token
POST   /api/auth/logout            - Logout user
```

### Accounts
```
GET    /api/accounts               - List connected accounts
POST   /api/accounts               - Connect new account (OAuth)
DELETE /api/accounts/:accountId    - Disconnect account
GET    /api/accounts/:accountId    - Get account details
```

### Posts
```
GET    /api/posts/:accountId       - List scheduled posts
POST   /api/posts/generate         - Generate 7-day pipeline
GET    /api/posts/:postId          - Get post details
PUT    /api/posts/:postId          - Edit scheduled post
DELETE /api/posts/:postId          - Cancel post
POST   /api/posts/:postId/publish-now - Publish immediately
GET    /api/posts/:postId/preview  - Preview (text + image)
```

### Brand Profiles
```
GET    /api/brand-profiles/:accountId       - Get settings
POST   /api/brand-profiles/:accountId       - Create/update settings
PUT    /api/brand-profiles/:accountId       - Update settings
GET    /api/brand-profiles/:accountId/validate - Test with sample post
```

### Settings
```
GET    /api/settings/:accountId    - Get posting schedule
PUT    /api/settings/:accountId    - Update schedule
POST   /api/settings/generation-trigger - Manual generation
```

### Analytics
```
GET    /api/analytics/:accountId/metrics   - Account-level metrics
GET    /api/analytics/:accountId/posts/:postId - Post metrics
GET    /api/analytics/:accountId/trends    - Trend analysis
GET    /api/analytics/export               - Export CSV/PDF
```

### Health
```
GET    /api/health                 - System health
GET    /api/jobs                   - Active jobs status
```

