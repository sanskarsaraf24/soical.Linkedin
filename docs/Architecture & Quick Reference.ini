**Quick Start:**
1. Fill out REQUIREMENTS.md
2. Setup VPS folder & env variables
3. Deploy backend: `npm install && pm2 start ecosystem.config.js`
4. Deploy frontend: `npm run build && pm2 start frontend`
5. Test OAuth: Visit http://your-domain.com and login
6. Generate posts: Click "Generate Posts" button
7. Watch magic happen! ✨

