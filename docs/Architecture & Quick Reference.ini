## Tech Stack Summary

| Layer | Technology | Purpose |
|-------|-----------|---------|
| **Frontend** | React 18 + TypeScript + Vite | SPA UI |
| **Styling** | Tailwind CSS | CSS utility framework |
| **Icons** | Lucide React | UI icons |
| **Backend** | Node.js + Express | REST API |
| **Database** | MongoDB (Atlas) | Data persistence |
| **AI/Content** | GROQ API | LLM for agents |
| **Search** | Brave Search API | Web research |
| **LinkedIn** | LinkedIn API v2 | Post & metrics |
| **Image** | Puppeteer | HTML → PNG |
| **Jobs** | Node-schedule | Cron jobs |
| **Auth** | OAuth 2.0 + JWT | Authentication |
| **Logging** | Winston | Application logs |
| **Deployment** | PM2 + VPS | Process management |

