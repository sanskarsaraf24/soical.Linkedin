## Weekly Generation Flow

```
MONDAY 00:00 IST
    ↓
Job Queue Trigger (Node-schedule)
    ↓
Fetch All Active Accounts
    ↓
For Each Account:
    ├─ Social Media Manager Agent
    │   ├─ Input: Brand profile, content pillars
    │   ├─ Brave Search: "trending [topic]" (1 call)
    │   └─ Output: 7 topics with hooks & angles
    │
    ├─ For Each Topic (Day 1-7):
    │   │
    │   ├─ Content Writer Agent
    │   │   ├─ Input: Topic, brand voice, tone
    │   │   ├─ Brave Search: Optional fact-check (1 call)
    │   │   └─ Output: Copy, CTAs, hashtags
    │   │
    │   ├─ Graphic Designer Agent
    │   │   ├─ Input: Topic, content, brand style
    │   │   ├─ Brave Search: Optional design inspiration (1 call)
    │   │   └─ Output: HTML/CSS design code
    │   │
    │   ├─ Image Rendering
    │   │   ├─ Convert HTML → PNG (1200x627px)
    │   │   └─ Store in /uploads/images/
    │   │
    │   └─ Save Post to DB
    │       ├─ Text, images, metadata
    │       ├─ Status: "scheduled"
    │       └─ Scheduled time: Day X at preferred time
    │
    └─ Update next generation date (next Monday)
    ↓
All 7 posts per account now scheduled
    ↓
Posting Job (Runs on scheduled times):
    └─ For each scheduled post:
        ├─ Call LinkedIn Posts API
        ├─ Update status: "posted"
        ├─ Store LinkedIn post ID
        └─ Queue metrics fetch
    ↓
Daily Metrics Job (12:00 PM & 6:00 PM IST):
    └─ For each posted post:
        ├─ Fetch from LinkedIn Analytics API
        ├─ Store impressions, reactions, comments, etc.
        └─ Calculate engagement rate
```

