## Data Flow: From Request to LinkedIn

```
User clicks "Generate Posts" on Dashboard
    ↓
POST /api/posts/generate (accountId)
    ↓
Backend validates account & brand profile
    ↓
Call Agent Orchestrator Service
    ↓
┌─────────────────────────────────────────────────────────────┐
│ AGENT PIPELINE (Sequential)                                 │
│                                                              │
│ 1. Social Media Manager Agent                               │
│    ├─ Prompt: "Generate 7 topics for [account]..."          │
│    ├─ GROQ API call                                         │
│    ├─ Brave Search (1 call for trends)                      │
│    └─ Output: topics array                                  │
│                ↓                                             │
│ 2. Content Writer Agent (runs 7x, one per topic)            │
│    ├─ Prompt: "Write LinkedIn post about [topic]..."        │
│    ├─ GROQ API call                                         │
│    ├─ Brave Search (optional 1 call per topic)              │
│    └─ Output: copy, cta, hashtags                           │
│                ↓                                             │
│ 3. Graphic Designer Agent (runs 7x, one per topic)          │
│    ├─ Prompt: "Design LinkedIn post image in HTML..."       │
│    ├─ GROQ API call                                         │
│    ├─ Brave Search (optional 1 call per topic)              │
│    └─ Output: HTML/CSS code                                 │
│                ↓                                             │
│ 4. Image Rendering (runs 7x)                                │
│    ├─ Call Puppeteer/Playwright                             │
│    ├─ Render HTML → PNG                                     │
│    └─ Save to /uploads/images/                              │
│                ↓                                             │
│ 5. Store in MongoDB (7x)                                    │
│    └─ generatedPosts collection                             │
└─────────────────────────────────────────────────────────────┘
    ↓
Return to Frontend: [7 posts with images]
    ↓
Frontend displays calendar view with all posts
    ↓
Job Queue picks up scheduled posts
    ↓
At scheduled time, Post Publication Job:
    ├─ Call LinkedIn Posts API
    ├─ POST /v2/shares (or /v2/posts)
    ├─ Include: text + image + metadata
    └─ Store LinkedIn post ID
    ↓
Post goes live on LinkedIn!
    ↓
Daily Metrics Job:
    ├─ Fetch /v2/socialActions
    ├─ Store metrics in postMetrics collection
    └─ Update generatedPosts with latest metrics
```

