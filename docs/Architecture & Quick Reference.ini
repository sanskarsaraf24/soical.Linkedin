## Support & Debugging

### Check System Health
```bash
pm2 status
pm2 logs linkedin-ai-backend
pm2 monit
```

### Restart Services
```bash
pm2 restart linkedin-ai-backend
pm2 restart all
```

### View Logs
```bash
tail -f /opt/linkedin-ai/logs/app.log
tail -f /opt/linkedin-ai/logs/error.log
```

### Common Issues

**OAuth fails:**
- Verify LinkedIn credentials in .env
- Check redirect URI matches in LinkedIn app settings

**Posts not generating:**
- Check GROQ API key
- Check agent logs in MongoDB
- Review error messages in logs

**Metrics not updating:**
- Verify LinkedIn API access
- Check if posts are actually on LinkedIn
- Review analytics job logs

**Image rendering fails:**
- Check Puppeteer is installed
- Verify write permissions for /uploads/images/
- Review image rendering service logs

