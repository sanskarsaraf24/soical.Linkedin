## PM2 Configuration (ecosystem.config.js)

```javascript
module.exports = {
  apps: [
    {
      name: 'linkedin-ai-backend',
      script: './src/server.js',
      instances: 1,
      exec_mode: 'cluster',
      env: {
        NODE_ENV: 'production',
        PORT: 3000
      },
      error_file: '/opt/linkedin-ai/logs/error.log',
      out_file: '/opt/linkedin-ai/logs/out.log',
      log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
      merge_logs: true,
      max_memory_restart: '500M',
      autorestart: true,
      watch: false,
      ignore_watch: ['node_modules', 'logs', 'uploads'],
      max_restarts: 10,
      min_uptime: '10s',
      restart_delay: 4000
    },
    {
      name: 'linkedin-ai-frontend',
      script: 'serve',
      args: '-s dist -l 5000',
      env: {
        NODE_ENV: 'production'
      },
      error_file: '/opt/linkedin-ai/logs/frontend-error.log',
      out_file: '/opt/linkedin-ai/logs/frontend-out.log'
    }
  ]
};
```

**Start:**
```bash
pm2 start ecosystem.config.js
pm2 save
pm2 startup
```

